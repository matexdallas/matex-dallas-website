   name: Supabase keep-alive
   on:
     schedule:
       - cron: "0 12 * * *"
     workflow_dispatch:
   jobs:
     ping:
       runs-on: ubuntu-latest
       steps:
         - run: |
             curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?select=id&limit=1" \
               -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
               -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
